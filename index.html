<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SAKKSI - AI for the Arab World</title>
  <meta name="description" content="SAKKSI, intelligence artificielle conçue pour le monde arabe. Posez une question, explorez, comprenez et découvrez.">
  <meta name="theme-color" content="#020b1b">

  <style>
    :root {
      --bg: #020b1b;
      --text: #07101e;
      --cyan: #55dfff;
      --blue: #237cff;
      --blue2: #4868ff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 560px;
      overflow: hidden;
      background: var(--bg);
      isolation: isolate;
    }

    /* ================================
       IMAGE RESPONSIVE PRO
       desktop  : sakksi-home.png
       tablette : sakksi-tablette.png
       mobile   : sakksi-mobile.png
       ================================ */

    .hero-picture {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
    }

    .hero-bg {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(
          to top,
          rgba(0, 7, 18, .34) 0%,
          rgba(0, 7, 18, .08) 28%,
          transparent 55%
        );
    }

    /* ================================
       BARRE SAKKSI
       ================================ */

    .sakksi-search-zone {
      position: absolute;
      z-index: 10;
      left: 50%;
      bottom: max(34px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(820px, calc(100vw - 56px));
    }

    .sakksi-search-zone::before {
      content: "";
      position: absolute;
      left: -45px;
      right: -45px;
      top: -30px;
      bottom: -30px;
      z-index: -1;
      border-radius: 999px;
      background:
        radial-gradient(
          ellipse at center,
          rgba(85, 223, 255, .24) 0%,
          rgba(35, 124, 255, .12) 40%,
          rgba(35, 124, 255, .03) 60%,
          transparent 76%
        );
      filter: blur(20px);
      animation: cloudPulse 4.2s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes cloudPulse {
      0%, 100% {
        opacity: .64;
        transform: scale(.98);
      }
      50% {
        opacity: 1;
        transform: scale(1.035);
      }
    }

    .sakksi-search {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 66px;
      padding: 7px 10px 7px 16px;
      gap: 9px;
      border: 1px solid rgba(255, 255, 255, .78);
      border-radius: 999px;
      background:
        linear-gradient(
          120deg,
          rgba(255, 255, 255, .92),
          rgba(235, 246, 255, .82)
        );
      backdrop-filter: blur(20px) saturate(145%);
      -webkit-backdrop-filter: blur(20px) saturate(145%);
      box-shadow:
        0 16px 45px rgba(0, 0, 0, .34),
        0 0 28px rgba(45, 190, 255, .19),
        inset 0 0 22px rgba(255, 255, 255, .22);
      transition:
        transform .25s ease,
        box-shadow .25s ease;
    }

    .sakksi-search:focus-within {
      transform: translateY(-2px);
      box-shadow:
        0 18px 56px rgba(0, 0, 0, .40),
        0 0 38px rgba(50, 200, 255, .30),
        inset 0 0 24px rgba(255, 255, 255, .28);
    }

    .sakksi-plus {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: grid;
      place-items: center;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 34px;
      font-weight: 300;
      line-height: 1;
      cursor: pointer;
      transition: transform .22s ease;
    }

    .sakksi-plus:hover {
      transform: rotate(90deg) scale(1.06);
    }

    .sakksi-name {
      color: var(--text);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .8px;
      white-space: nowrap;
      user-select: none;
    }

    .sakksi-input {
      flex: 1;
      min-width: 0;
      height: 48px;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      font-weight: 500;
      padding: 0 8px;
    }

    .sakksi-input::placeholder {
      color: rgba(20, 30, 45, .48);
    }

    .sakksi-mic {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: #10131a;
      cursor: pointer;
      transition: background .2s ease, transform .2s ease;
    }

    .sakksi-mic:hover {
      background: rgba(0, 80, 150, .08);
      transform: scale(1.05);
    }

    .sakksi-mic svg {
      width: 24px;
      height: 24px;
    }

    .sakksi-voice {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      display: grid;
      place-items: center;
      border: none;
      border-radius: 50%;
      color: white;
      background: linear-gradient(145deg, var(--blue), var(--blue2));
      box-shadow: 0 0 18px rgba(35, 124, 255, .34);
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .sakksi-voice:hover {
      transform: scale(1.06);
      box-shadow: 0 0 28px rgba(35, 145, 255, .55);
    }

    .sakksi-voice svg {
      width: 27px;
      height: 27px;
      stroke: white;
    }

    .sakksi-tagline {
      margin-top: 10px;
      text-align: center;
      color: rgba(225, 247, 255, .78);
      font-size: 11px;
      letter-spacing: 2px;
      text-shadow: 0 2px 9px rgba(0, 0, 0, .72);
      opacity: .82;
      user-select: none;
    }

    /* TABLETTE */
    @media (max-width: 1100px) {
      .hero {
        min-height: 620px;
      }

      .sakksi-search-zone {
        bottom: max(28px, env(safe-area-inset-bottom));
        width: min(760px, calc(100vw - 38px));
      }

      .sakksi-search {
        min-height: 62px;
      }

      .sakksi-name {
        font-size: 15px;
      }

      .sakksi-input {
        font-size: 15px;
      }

      .sakksi-voice {
        width: 48px;
        height: 48px;
        flex-basis: 48px;
      }
    }

    /* MOBILE */
    @media (max-width: 600px) {
      .hero {
        min-height: 100dvh;
      }

      .sakksi-search-zone {
        bottom: max(16px, env(safe-area-inset-bottom));
        width: calc(100vw - 20px);
      }

      .sakksi-search {
        min-height: 56px;
        padding: 6px 7px 6px 8px;
        gap: 4px;
      }

      .sakksi-plus {
        width: 32px;
        height: 32px;
        flex-basis: 32px;
        font-size: 28px;
      }

      .sakksi-name {
        font-size: 13px;
      }

      .sakksi-input {
        height: 40px;
        padding: 0 4px;
        font-size: 14px;
      }

      .sakksi-input::placeholder {
        font-size: 13px;
      }

      .sakksi-mic {
        width: 34px;
        height: 34px;
        flex-basis: 34px;
      }

      .sakksi-mic svg {
        width: 20px;
        height: 20px;
      }

      .sakksi-voice {
        width: 42px;
        height: 42px;
        flex-basis: 42px;
      }

      .sakksi-voice svg {
        width: 22px;
        height: 22px;
      }

      .sakksi-tagline {
        display: none;
      }

      .sakksi-search-zone::before {
        left: -15px;
        right: -15px;
      }
    }

    @media (max-width: 410px) {
      .sakksi-name {
        display: none;
      }

      .sakksi-input {
        font-size: 13px;
      }
    }

    @media (max-height: 650px) and (min-width: 601px) {
      .sakksi-search-zone {
        bottom: 18px;
      }

      .sakksi-tagline {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sakksi-search-zone::before {
        animation: none;
      }

      .sakksi-search,
      .sakksi-plus,
      .sakksi-mic,
      .sakksi-voice {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="hero">

    <picture class="hero-picture">
      <source media="(max-width: 600px)" srcset="sakksi-mobile.png">
      <source media="(max-width: 1100px)" srcset="sakksi-tablette.png">

      <img
        src="sakksi-home.png"
        alt="SAKKSI - Intelligence artificielle pour le monde arabe"
        class="hero-bg">
    </picture>

    <div class="sakksi-search-zone">
      <form class="sakksi-search" id="sakksiForm">

        <button type="button" class="sakksi-plus" aria-label="Ajouter">+</button>

        <span class="sakksi-name">SAKKSI</span>

        <input
          type="text"
          class="sakksi-input"
          id="sakksiInput"
          placeholder="Ask SAKKSI..."
          aria-label="Ask SAKKSI"
          autocomplete="off">

        <button type="button" class="sakksi-mic" aria-label="Microphone">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="9" y="2" width="6" height="11" rx="3"></rect>
            <path d="M5 10a7 7 0 0 0 14 0"></path>
            <line x1="12" y1="17" x2="12" y2="22"></line>
          </svg>
        </button>

        <button type="submit" class="sakksi-voice" aria-label="Ask SAKKSI">
          <svg
            viewBox="0 0 32 32"
            fill="none"
            stroke-width="2.6"
            stroke-linecap="round">
            <line x1="7" y1="13" x2="7" y2="19"></line>
            <line x1="12" y1="8" x2="12" y2="24"></line>
            <line x1="17" y1="5" x2="17" y2="27"></line>
            <line x1="22" y1="9" x2="22" y2="23"></line>
            <line x1="27" y1="13" x2="27" y2="19"></line>
          </svg>
        </button>

      </form>

      <div class="sakksi-tagline">INTELLIGENCE FOR THE ARAB WORLD</div>
    </div>

  </main>

  <script>
    const sakksiForm = document.getElementById("sakksiForm");
    const sakksiInput = document.getElementById("sakksiInput");

    sakksiForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const question = sakksiInput.value.trim();

      if (!question) {
        sakksiInput.focus();
        return;
      }

      /*
        PROCHAINE ETAPE :
        connexion de SAKKSI à l'IA
        via un backend sécurisé.
      */

      console.log("Question envoyée à SAKKSI :", question);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SAKKSI — AI for the Arab World</title>
  <meta name="description" content="SAKKSI, intelligence artificielle pour le monde arabe. Frottez la lampe et faites apparaître SAKKSI.">
  <meta name="theme-color" content="#030914">

  <style>
    :root{
      --bg:#030914;
      --glass:rgba(5,18,38,.76);
      --line:rgba(101,214,255,.38);
      --cyan:#6ee7ff;
      --blue:#178cff;
      --blue2:#5b63ff;
      --gold:#ffc86a;
      --white:#f7fbff;
      --muted:rgba(225,242,255,.68);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%}
    body{
      overflow:hidden;
      background:var(--bg);
      font-family:Inter,Arial,Helvetica,sans-serif;
      color:var(--white);
    }
    button,input{font:inherit}

    /* =========================================================
       SCÈNE
       ========================================================= */

    .scene{
      position:relative;
      width:100%;
      height:100vh;
      height:100dvh;
      min-height:560px;
      overflow:hidden;
      isolation:isolate;
      background:#030914;
    }

    .scene-bg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center center;
      z-index:1;
      user-select:none;
      -webkit-user-drag:none;
      pointer-events:none;
    }

    .scene::after{
      content:"";
      position:absolute;
      inset:0;
      z-index:2;
      pointer-events:none;
      background:
        linear-gradient(to top,rgba(0,5,15,.46) 0%,rgba(0,5,15,.10) 34%,transparent 62%),
        radial-gradient(circle at 24% 76%,rgba(0,105,255,.08),transparent 28%);
    }

    /* =========================================================
       ZONE INVISIBLE À FROTTER — POSITIONNÉE SUR LA LAMPE
       Ajuste left/top/width/height si nécessaire.
       ========================================================= */

    .lamp-rub-zone{
      position:absolute;
      left:7.5%;
      top:55%;
      width:27%;
      height:34%;
      z-index:20;
      cursor:grab;
      touch-action:none;
      border-radius:40% 55% 45% 50%;
      user-select:none;
      -webkit-user-select:none;
    }

    .lamp-rub-zone:active{cursor:grabbing}

    /* halo autour de la lampe pendant le frottement */
    .lamp-rub-zone::before{
      content:"";
      position:absolute;
      inset:10%;
      border-radius:50%;
      opacity:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 62% 48%,
          rgba(108,231,255,.42) 0%,
          rgba(34,145,255,.20) 32%,
          rgba(0,83,255,.06) 54%,
          transparent 74%);
      filter:blur(16px);
      transition:opacity .2s ease;
      mix-blend-mode:screen;
    }

    .lamp-rub-zone.rubbing::before{
      opacity:1;
      animation:lampPulse .65s ease-in-out infinite alternate;
    }

    @keyframes lampPulse{
      from{transform:scale(.94);filter:blur(14px)}
      to{transform:scale(1.07);filter:blur(22px)}
    }

    /* consigne discrète */
    .rub-hint{
      position:absolute;
      left:9%;
      bottom:6%;
      z-index:15;
      padding:10px 16px;
      border:1px solid rgba(255,200,106,.30);
      border-radius:999px;
      background:rgba(6,12,25,.44);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      color:rgba(255,235,200,.82);
      font-size:12px;
      letter-spacing:.8px;
      box-shadow:0 8px 30px rgba(0,0,0,.24);
      transition:opacity .5s ease,transform .5s ease;
      pointer-events:none;
    }

    .rub-hint.hide{
      opacity:0;
      transform:translateY(8px);
    }

    /* =========================================================
       FUMÉE / ÉNERGIE — CSS
       ========================================================= */

    .magic{
      position:absolute;
      left:24%;
      top:37%;
      width:24vw;
      height:43vh;
      z-index:8;
      opacity:0;
      pointer-events:none;
      transform-origin:bottom left;
      transform:scale(.55) translateY(25%);
      transition:opacity .8s ease,transform 1.2s cubic-bezier(.2,.8,.2,1);
    }

    .magic::before,
    .magic::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        radial-gradient(ellipse at 30% 80%,rgba(98,228,255,.72),transparent 26%),
        radial-gradient(ellipse at 50% 55%,rgba(47,142,255,.40),transparent 34%),
        radial-gradient(ellipse at 65% 26%,rgba(127,237,255,.22),transparent 30%);
      filter:blur(22px);
      mix-blend-mode:screen;
      animation:smokeFloat 3.4s ease-in-out infinite alternate;
    }

    .magic::after{
      transform:rotate(-18deg) scale(.78);
      opacity:.65;
      animation-delay:-1.2s;
    }

    @keyframes smokeFloat{
      from{transform:translate(-2%,3%) rotate(-5deg) scale(.92)}
      to{transform:translate(4%,-5%) rotate(7deg) scale(1.08)}
    }

    .scene.awake .magic{
      opacity:1;
      transform:scale(1) translateY(0);
    }

    /* =========================================================
       GÉNIE / SAKKSI
       Prévoir sakksi-genie.png en PNG transparent.
       ========================================================= */

    .genie-wrap{
      position:absolute;
      left:28%;
      bottom:12%;
      width:min(40vw,620px);
      z-index:9;
      opacity:0;
      transform:translateY(18%) scale(.80);
      transform-origin:bottom center;
      filter:drop-shadow(0 0 28px rgba(63,190,255,.46));
      pointer-events:none;
      transition:
        opacity 1.1s ease .35s,
        transform 1.25s cubic-bezier(.16,.84,.3,1) .25s;
    }

    .genie{
      width:100%;
      display:block;
      user-select:none;
      -webkit-user-drag:none;
    }

    .scene.awake .genie-wrap{
      opacity:1;
      transform:translateY(0) scale(1);
    }

    .genie-wrap::after{
      content:"";
      position:absolute;
      left:8%;
      right:6%;
      bottom:-5%;
      height:24%;
      border-radius:50%;
      background:radial-gradient(ellipse,rgba(73,196,255,.42),transparent 70%);
      filter:blur(18px);
      z-index:-1;
      animation:holoGlow 2.8s ease-in-out infinite alternate;
    }

    @keyframes holoGlow{
      from{opacity:.45;transform:scale(.92)}
      to{opacity:.95;transform:scale(1.06)}
    }

    /* =========================================================
       CHAT
       ========================================================= */

    .chat-shell{
      position:absolute;
      left:50%;
      bottom:max(28px,env(safe-area-inset-bottom));
      width:min(820px,calc(100vw - 50px));
      transform:translate(-50%,38px) scale(.96);
      z-index:30;
      opacity:0;
      visibility:hidden;
      transition:
        opacity .6s ease .85s,
        transform .75s cubic-bezier(.2,.8,.2,1) .8s,
        visibility 0s linear 1.5s;
    }

    .scene.awake .chat-shell{
      opacity:1;
      visibility:visible;
      transform:translate(-50%,0) scale(1);
      transition-delay:.9s,.8s,0s;
    }

    .chat{
      display:flex;
      align-items:center;
      gap:9px;
      min-height:66px;
      padding:7px 10px 7px 16px;
      border:1px solid rgba(255,255,255,.75);
      border-radius:999px;
      background:
        linear-gradient(120deg,rgba(255,255,255,.91),rgba(233,245,255,.82));
      color:#09111c;
      backdrop-filter:blur(22px) saturate(145%);
      -webkit-backdrop-filter:blur(22px) saturate(145%);
      box-shadow:
        0 18px 56px rgba(0,0,0,.40),
        0 0 38px rgba(42,188,255,.24);
    }

    .brand{
      font-weight:900;
      font-size:15px;
      letter-spacing:.9px;
      white-space:nowrap;
      padding-left:4px;
    }

    .input{
      flex:1;
      min-width:0;
      height:48px;
      border:none;
      outline:none;
      background:transparent;
      color:#07101e;
      font-size:16px;
      padding:0 8px;
    }

    .input::placeholder{color:rgba(20,30,45,.46)}

    .icon-btn{
      display:grid;
      place-items:center;
      border:0;
      cursor:pointer;
      border-radius:50%;
    }

    .mic{
      width:42px;
      height:42px;
      background:transparent;
      color:#10131a;
    }

    .voice{
      width:52px;
      height:52px;
      background:linear-gradient(145deg,var(--blue),var(--blue2));
      color:white;
      box-shadow:0 0 18px rgba(35,124,255,.36);
    }

    .mic svg{width:23px;height:23px}
    .voice svg{width:27px;height:27px;stroke:white}

    .tagline{
      margin-top:9px;
      text-align:center;
      font-size:10px;
      letter-spacing:2.2px;
      color:rgba(224,244,255,.70);
      text-shadow:0 2px 9px rgba(0,0,0,.72);
    }

    /* bouton réveiller sans geste (accessibilité) */
    .summon-btn{
      position:absolute;
      right:26px;
      bottom:26px;
      z-index:31;
      display:none;
      border:1px solid rgba(108,231,255,.35);
      background:rgba(5,18,38,.64);
      color:#e9faff;
      padding:10px 14px;
      border-radius:999px;
      cursor:pointer;
      backdrop-filter:blur(10px);
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width:1000px){
      .lamp-rub-zone{
        left:5%;
        top:59%;
        width:33%;
        height:32%;
      }

      .genie-wrap{
        left:24%;
        bottom:15%;
        width:min(50vw,560px);
      }

      .magic{
        left:20%;
        top:42%;
        width:30vw;
      }

      .rub-hint{
        left:7%;
        bottom:5%;
      }
    }

    @media (max-width:600px){
      .scene{
        min-height:100dvh;
      }

      .scene-bg{
        object-position:center center;
      }

      .lamp-rub-zone{
        left:2%;
        top:72%;
        width:46%;
        height:25%;
      }

      .rub-hint{
        left:12px;
        bottom:98px;
        max-width:58vw;
        font-size:11px;
      }

      .magic{
        left:12%;
        top:42%;
        width:44vw;
        height:42vh;
      }

      .genie-wrap{
        left:14%;
        bottom:18%;
        width:76vw;
      }

      .chat-shell{
        bottom:max(12px,env(safe-area-inset-bottom));
        width:calc(100vw - 18px);
      }

      .chat{
        min-height:56px;
        padding:6px 7px 6px 10px;
        gap:4px;
      }

      .brand{
        font-size:12px;
      }

      .input{
        height:40px;
        font-size:14px;
        padding:0 4px;
      }

      .mic{
        width:34px;
        height:34px;
      }

      .voice{
        width:42px;
        height:42px;
      }

      .mic svg{width:20px;height:20px}
      .voice svg{width:22px;height:22px}
      .tagline{display:none}
    }

    @media (max-width:400px){
      .brand{display:none}
    }

    @media (prefers-reduced-motion:reduce){
      .magic::before,
      .magic::after,
      .genie-wrap::after,
      .lamp-rub-zone.rubbing::before{
        animation:none;
      }
    }
  </style>
</head>

<body>

  <main class="scene" id="scene">

    <!--
      IMAGE DE FOND PHOTORÉALISTE :
      renomme l'image validée en sakksi-home-realiste.png
    -->
    <img
      class="scene-bg"
      src="sakksi-home-realiste.png"
      alt="Skyline nocturne de Dubaï et lampe SAKKSI">

    <!-- Halo/fumée -->
    <div class="magic" aria-hidden="true"></div>

    <!--
      Génie séparée :
      PNG transparent à créer ensuite.
    -->
    <div class="genie-wrap" aria-hidden="true">
      <img
        class="genie"
        src="sakksi-genie.png"
        alt="">
    </div>

    <!-- Zone de geste invisible positionnée sur la lampe -->
    <div
      class="lamp-rub-zone"
      id="lampRubZone"
      role="button"
      tabindex="0"
      aria-label="Frotter la lampe pour réveiller SAKKSI">
    </div>

    <div class="rub-hint" id="rubHint">
      ✦ Frottez la lampe pour réveiller SAKKSI
    </div>

    <!-- Chat SAKKSI -->
    <div class="chat-shell" id="chatShell">

      <form class="chat" id="sakksiForm">

        <span class="brand">SAKKSI</span>

        <input
          id="sakksiInput"
          class="input"
          type="text"
          placeholder="Ask SAKKSI..."
          autocomplete="off"
          aria-label="Ask SAKKSI">

        <button
          type="button"
          class="icon-btn mic"
          aria-label="Microphone">
          <svg viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2" width="6" height="11" rx="3"></rect>
            <path d="M5 10a7 7 0 0 0 14 0"></path>
            <line x1="12" y1="17" x2="12" y2="22"></line>
          </svg>
        </button>

        <button
          type="submit"
          class="icon-btn voice"
          aria-label="Ask SAKKSI">
          <svg viewBox="0 0 32 32" fill="none"
               stroke-width="2.6" stroke-linecap="round">
            <line x1="7" y1="13" x2="7" y2="19"></line>
            <line x1="12" y1="8" x2="12" y2="24"></line>
            <line x1="17" y1="5" x2="17" y2="27"></line>
            <line x1="22" y1="9" x2="22" y2="23"></line>
            <line x1="27" y1="13" x2="27" y2="19"></line>
          </svg>
        </button>

      </form>

      <div class="tagline">
        INTELLIGENCE FOR THE ARAB WORLD
      </div>

    </div>

    <button class="summon-btn" id="summonBtn">
      Réveiller SAKKSI
    </button>

  </main>


  <script>
    const scene = document.getElementById("scene");
    const lamp = document.getElementById("lampRubZone");
    const hint = document.getElementById("rubHint");
    const form = document.getElementById("sakksiForm");
    const input = document.getElementById("sakksiInput");

    let awake = false;

    // progression du geste de frottement
    let rubbing = false;
    let lastX = 0;
    let distance = 0;
    let directionChanges = 0;
    let lastDirection = 0;

    const REQUIRED_DISTANCE = 260;
    const REQUIRED_CHANGES = 3;

    function awakenSakksi() {
      if (awake) return;

      awake = true;
      rubbing = false;

      lamp.classList.remove("rubbing");
      hint.classList.add("hide");
      scene.classList.add("awake");

      setTimeout(() => {
        input.focus();
      }, 1700);
    }

    function resetRub() {
      rubbing = false;
      lamp.classList.remove("rubbing");

      // on garde une partie de la progression :
      // l'utilisateur n'a pas besoin d'être ultra précis
      distance *= 0.55;
      directionChanges = Math.max(0, directionChanges - 1);
      lastDirection = 0;
    }

    lamp.addEventListener("pointerdown", (event) => {
      if (awake) return;

      rubbing = true;
      lastX = event.clientX;
      distance = Math.max(distance, 0);
      lamp.classList.add("rubbing");

      try {
        lamp.setPointerCapture(event.pointerId);
      } catch (e) {}
    });

    lamp.addEventListener("pointermove", (event) => {
      if (!rubbing || awake) return;

      const dx = event.clientX - lastX;
      lastX = event.clientX;

      if (Math.abs(dx) < 2) return;

      distance += Math.abs(dx);

      const direction = Math.sign(dx);

      if (
        lastDirection !== 0 &&
        direction !== lastDirection
      ) {
        directionChanges++;
      }

      lastDirection = direction;

      // léger feedback visuel pendant le geste
      const progress = Math.min(
        1,
        distance / REQUIRED_DISTANCE
      );

      lamp.style.filter =
        `brightness(${1 + progress * .25})`;

      if (
        distance >= REQUIRED_DISTANCE &&
        directionChanges >= REQUIRED_CHANGES
      ) {
        awakenSakksi();
      }
    });

    lamp.addEventListener("pointerup", resetRub);
    lamp.addEventListener("pointercancel", resetRub);
    lamp.addEventListener("lostpointercapture", resetRub);

    // clavier / accessibilité
    lamp.addEventListener("keydown", (event) => {
      if (
        event.key === "Enter" ||
        event.key === " "
      ) {
        event.preventDefault();
        awakenSakksi();
      }
    });

    // fallback : double clic rapide sur la lampe
    lamp.addEventListener("dblclick", awakenSakksi);


    /* =====================================
       CHAT
       ===================================== */

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const question = input.value.trim();

      if (!question) {
        input.focus();
        return;
      }

      /*
        PROCHAINE ÉTAPE :
        envoyer "question" au backend sécurisé
        de SAKKSI, puis afficher la réponse IA.
      */

      console.log(
        "Question envoyée à SAKKSI :",
        question
      );
    });
  </script>

</body>
</html>
